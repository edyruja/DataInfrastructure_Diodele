name = "datainfrastructure-diodele"
main = "src/index.js"
compatibility_date = "2026-01-01"

[[d1_databases]]
binding = "DB"
database_name = "pero_diodele"
database_id = "39ed8046-a6ba-440f-9b3f-0585373a0750"

# PRODUCER: binding-ul care permite Worker-ului să trimită mesaje în coadă
[[queues.producers]]
binding = "TELEMETRY_QUEUE"
queue = "telemetry-queue"

# CONSUMER: Cloudflare apelează automat handler-ul queue() când vin mesaje
[[queues.consumers]]
queue = "telemetry-queue"
max_batch_size = 50
max_batch_timeout = 1
